[project]
name = "vla-finetune-data-collection"
version = "0.1.0"
description = "Real-robot demo collection on the xArm using ril-env + offline converter to LIBERO HDF5."
requires-python = ">=3.10,<3.13"

# Runtime deps for ril-env's data collection stack + the LIBERO HDF5 converter.
# Notably absent: torch, tensorflow, transformers — those belong to the VLA
# training workflow at the repo root, which is a separate uv project.
#
# We do NOT depend on `xarm-python-sdk` from PyPI: ril-env vendors the SDK at
# `ril-env/xarm/`, and the data-collection scripts prepend `ril-env/` to
# sys.path so the vendored copy wins. Installing the PyPI package alongside
# would create an import-shadowing footgun.
dependencies = [
    # Core math + IO
    "numpy>=1.24,<2.0",
    "scipy>=1.10",
    "h5py>=3.0",
    "click>=8.0",

    # Replay buffer storage (ril-env zarr layout)
    "zarr>=2.17,<3",
    "numcodecs>=0.12,<0.16",
    "atomics>=1.0",              # used by ril-env/shared_memory/shared_memory_util.py

    # Cameras
    "pyrealsense2>=2.55",
    "opencv-python>=4.5",
    "av>=10.0",                  # PyAV — used by ril-env/ril_env/video_recorder.py
    "threadpoolctl>=3.0",        # used by ril-env/ril_env/realsense.py

    # Teleop input
    "pynput>=1.7",               # keyboard listener (KeystrokeCounter)
    "spnav",                     # SpaceMouse wrapper — pinned via [tool.uv.sources] below
    "hidapi>=0.14",
]

# PyPI's `spnav==0.9` is a 2010 Python-2 package and crashes on import in Python 3
# (references `PyCObject_AsVoidPtr`, removed in Python 3.2). cheng-chi's fork patches
# this to use `PyCapsule_GetPointer`. ril-env was developed against this fork.
[tool.uv.sources]
spnav = { git = "https://github.com/cheng-chi/spnav", rev = "c1c938ebe3cc542db4685e0d13850ff1abfdb943" }

[tool.uv]
# This project doesn't ship as a package — it's just a dependency manifest
# for the two scripts in this directory. uv won't try to build/install it.
package = false
