[project]
name = "vla-finetune-phone-data-bridge"
version = "0.1.0"
description = "Convert phone_data_collection zarr -> LIBERO HDF5 for VLA finetuning."
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24,<2.0",
    "scipy>=1.10",
    "zarr>=2.17,<3",                 # phone_data_collection uses zarr<3
    "numcodecs>=0.12,<0.16",
    "h5py>=3.0",
    "opencv-python>=4.5",
    "click>=8.0",
]

[tool.uv]
package = false
