[project]
name = "phone-rlds-builder"
version = "0.1.0"
description = "TFDS build env for phone-collected LIBERO HDF5 -> RLDS."
requires-python = ">=3.10,<3.12"
dependencies = [
    "tensorflow==2.15.0",
    "tensorflow-datasets==4.9.3",
    "h5py>=3.0",
    "numpy>=1.24,<2.0",
    "absl-py",
    "protobuf",
    "tqdm",
]

[tool.uv]
package = false
